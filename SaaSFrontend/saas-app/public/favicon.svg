<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="arch_grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#df9e8e"/>
      <stop offset="50%" stop-color="#b3b7db"/>
      <stop offset="100%" stop-color="#98c1a9"/>
    </linearGradient>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background with subtle border -->
  <rect width="64" height="64" rx="18" fill="url(#bg_grad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Arch / Architectural Monogram Emblem -->
  <g filter="url(#glow)">
    <!-- Main Arch Pillar Left -->
    <path d="M18 48 V27 C18 19.268 24.268 13 32 13 C39.732 13 46 19.268 46 27 V48" 
          stroke="url(#arch_grad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Crossbar -->
    <path d="M18 34 H46" 
          stroke="url(#arch_grad)" 
          stroke-width="4" 
          stroke-linecap="round"/>

    <!-- Luminous Center Jewel -->
    <circle cx="32" cy="23" r="3" fill="#df9e8e"/>
  </g>
</svg>